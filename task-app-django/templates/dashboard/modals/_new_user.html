<!-- MODAL: NOVO USUÁRIO -->
<div class="modal fade" id="modalUser" tabindex="-1" aria-labelledby="modalUserLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form method="POST" action="/web/users">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalUserLabel"><i class="bi bi-person-plus me-2"></i>Novo Usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome Completo *</label>
                        <input type="text" name="name" class="form-control" placeholder="ex: Leonardo Lima" required maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">E-mail *</label>
                        <input type="email" name="email" class="form-control" placeholder="ex: usuario@tasktrack.com" required maxlength="255">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Função (Role) *</label>
                        <select name="role" class="form-select">
                            <option value="MEMBER" selected>MEMBER</option>
                            <option value="ADMIN">ADMIN</option>
                            <option value="DEVELOPER">Developer</option>
                            <option value="TEST">Test</option>
                            <option value="MANAGER">Manager</option>
                            <option value="PRODUCT_OWNER">Product Owner</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Senha *</label>
                        <input type="password" name="password" class="form-control" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirmar senha *</label>
                        <input type="password" name="password_confirmation" class="form-control" minlength="8" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Cadastrar Usuário</button>
                </div>
            </div>
        </form>
    </div>
</div>
