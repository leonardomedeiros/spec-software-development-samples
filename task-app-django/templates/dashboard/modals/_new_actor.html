<!-- MODAL: NOVO ATOR -->
<div class="modal fade" id="modalActor" tabindex="-1" aria-labelledby="modalActorLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form method="POST" action="/web/actors">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalActorLabel"><i class="bi bi-people me-2"></i>Novo Ator</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome (2 a 100 caracteres) *</label>
                        <input type="text" name="name" class="form-control" placeholder="ex: Cliente, Administrador, Atendente" required minlength="2" maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descrição (Suporta Markdown)</label>
                        <textarea name="description" class="form-control" style="min-height: 150px; resize: vertical;" placeholder="Descreva o papel deste ator no sistema."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Cadastrar Ator</button>
                </div>
            </div>
        </form>
    </div>
</div>
