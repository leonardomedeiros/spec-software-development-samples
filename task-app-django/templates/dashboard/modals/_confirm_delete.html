<!-- MODAL: CONFIRMAÇÃO DE EXCLUSÃO -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-danger bg-opacity-10 border-danger">
                <h5 class="modal-title fw-bold text-danger" id="confirmDeleteLabel">
                    <i class="bi bi-exclamation-triangle me-2"></i>Confirmar Exclusão
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center py-4">
                <p class="fs-5 mb-2">Tem certeza que deseja <strong id="confirmDeleteEntityLabel">excluir esta tarefa</strong>?</p>
                <p id="confirmDeleteWarning" class="text-warning small mb-2" hidden></p>
                <p class="text-muted small mb-0">Esta ação não pode ser desfeita.</p>
            </div>
            <div class="modal-footer gap-2">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="bi bi-trash me-1"></i><span id="confirmDeleteBtnLabel">Excluir Tarefa</span>
                </button>
            </div>
        </div>
    </div>
</div>
