<!-- Stats Counter -->
<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex align-items-center">
                <div class="bg-primary bg-opacity-10 text-primary p-3 rounded me-3">
                    <i class="bi bi-folder2-open fs-3"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">Projetos</h6>
                    <h4 class="fw-bold mb-0">{{ projects|length }}</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex align-items-center">
                <div class="bg-warning bg-opacity-10 text-warning p-3 rounded me-3">
                    <i class="bi bi-hourglass-split fs-3"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">Pendentes</h6>
                    <h4 class="fw-bold mb-0">{{ pending_tasks|length }}</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex align-items-center">
                <div class="bg-info bg-opacity-10 text-info p-3 rounded me-3">
                    <i class="bi bi-arrow-repeat fs-3"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">Em Andamento</h6>
                    <h4 class="fw-bold mb-0">{{ in_progress_tasks|length }}</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex align-items-center">
                <div class="bg-success bg-opacity-10 text-success p-3 rounded me-3">
                    <i class="bi bi-check2-circle fs-3"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">Concluídas</h6>
                    <h4 class="fw-bold mb-0">{{ completed_tasks|length }}</h4>
                </div>
            </div>
        </div>
    </div>
</div>
