{% extends "base.html" %}

{% block title %}Editar Contrato — TaskTrack{% endblock %}

{% block content %}
<div class="container" style="max-width:720px;">
    <div class="card shadow-sm border-0 mt-3 mb-4">
        <div class="card-header bg-white border-bottom">
            <h5 class="fw-bold mb-0"><i class="bi bi-pencil me-2"></i>Editar Contrato <span class="text-muted fw-normal">#{{ contract.display_id }}</span></h5>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="invalid-feedback d-block">{{ error }}</div>
                    {% endfor %}
                </div>
                {% endfor %}
                <div class="d-flex gap-2 mt-4">
                    <a href="/" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
