[project]
name = "tasktrack"
version = "0.1.0"
description = "TaskTrack Django application"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "pydantic>=2.0,<3.0",
    "psycopg2-binary>=2.9.9",
    "python-decouple>=3.8",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]
